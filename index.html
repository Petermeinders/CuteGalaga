<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>CuteGalaga</title>
<meta name="description" content="Assemble your space buddy and blast the bugs!" />
<meta name="theme-color" content="#0b1026" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/favicon.ico" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CuteGalaga" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Orbitron:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="starfield" aria-hidden="true" id="starfield"></div>
  <div class="bug-deco" aria-hidden="true">
    <img class="deco d1" src="assets/enemies/bug-ladybug.png" alt="" />
    <img class="deco d2" src="assets/enemies/bug-bee.png" alt="" />
    <img class="deco d3" src="assets/enemies/bug-purple.png" alt="" />
    <img class="deco d4" src="assets/enemies/bug-brown.png" alt="" />
  </div>

  <header class="hud hidden" id="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span id="scoreEl" class="hud-value">0</span>
    </div>
    <div class="hud-block center">
      <span class="brand">CuteGalaga</span>
    </div>
    <div class="hud-block right">
      <span class="hud-label" id="livesLabel">Lives</span>
      <span id="livesEl" class="hud-value">♥♥♥</span>
    </div>
  </header>

  <!-- Ship builder (menu) -->
  <section id="builderScreen" class="builder-screen" aria-label="Ship builder">
    <h1 class="builder-title">CuteGalaga</h1>
    <p class="builder-sub">Assemble your space buddy!</p>

    <div class="ship-preview" aria-live="polite">
      <div id="previewShip" class="preview-ship">
        <img id="previewWings" class="layer wings" alt="" />
        <img id="previewCore" class="layer core" alt="" />
        <img id="previewBlaster" class="layer blaster" alt="" />
      </div>
    </div>

    <div class="reels" id="reels">
      <div class="reel-col" data-kind="wing">
        <div class="reel-label">Wings</div>
        <div class="reel-window">
          <div class="reel-track" id="wingTrack"></div>
        </div>
      </div>
      <div class="reel-col" data-kind="core">
        <div class="reel-label">Core</div>
        <div class="reel-window">
          <div class="reel-track" id="coreTrack"></div>
        </div>
      </div>
      <div class="reel-col" data-kind="blaster">
        <div class="reel-label">Blaster</div>
        <div class="reel-window">
          <div class="reel-track" id="blasterTrack"></div>
        </div>
      </div>
      <div class="reel-select" aria-hidden="true"></div>
    </div>

    <p id="buildHint" class="build-hint"></p>

    <div class="builder-opts">
      <label class="mini-toggle" for="autofireToggle"><input id="autofireToggle" type="checkbox" checked /><span>Autofire</span></label>
      <label class="mini-toggle" for="cuteToggle"><input id="cuteToggle" type="checkbox" checked /><span>Cute</span></label>
      <label class="mini-toggle" for="slowToggle"><input id="slowToggle" type="checkbox" /><span>Slow</span></label>
      <label class="mini-toggle" for="coopToggle"><input id="coopToggle" type="checkbox" /><span>Coop</span></label>
    </div>

    <div class="builder-actions">
      <button id="spinBtn" class="spin-btn" type="button">SPIN! ✦</button>
      <button id="startBtn" class="play-btn" type="button">PLAY</button>
    </div>
  </section>

  <main class="stage hidden" id="stage">
    <canvas id="game" width="360" height="640" aria-label="CuteGalaga game canvas"></canvas>
    <div id="overlay" class="overlay hidden" aria-hidden="true">
      <div class="panel">
        <h1 class="title" id="endTitle">Game Over</h1>
        <p class="tagline" id="taglineEl"></p>
        <button id="againBtn" class="play-btn" type="button">Play Again</button>
        <button id="builderBtn" class="spin-btn" type="button">Ship Builder</button>
      </div>
    </div>
  </main>

  <footer class="controls hidden" id="controls" aria-label="Touch controls">
    <button id="leftBtn" class="ctrl-btn" type="button" aria-label="Move left">◀</button>
    <button id="fireBtn" class="ctrl-btn fire" type="button" aria-label="Fire">✦</button>
    <button id="rightBtn" class="ctrl-btn" type="button" aria-label="Move right">▶</button>
  </footer>

  <script src="game.js"></script>
</body>
</html>
